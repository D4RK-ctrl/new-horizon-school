# Disposable local Phase 2A verification only; never link this project remotely.
project_id = "nhs-phase2a-verification"

[api]
enabled = true
port = 55431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55430
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[db.pooler]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = false

[local_smtp]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[studio]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
